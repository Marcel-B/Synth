# Checks that the secrets the other workflows need are set and valid, without building or publishing anything: the
# GitHub token may write the repository, the certificates open with their passwords and hold the Developer ID
# identities of the team, and Apple accepts the Apple ID (notarization) and the App Store Connect key (TestFlight).
# Started by hand after secrets changed (scripts/setup-gitea-secrets.sh), and whenever this file changes.
name: Secrets prüfen

on:
  push:
    paths: [.gitea/workflows/secrets-check.yml]
  workflow_dispatch:

env:
  RELEASE_REPO: Marcel-B/Synth

jobs:
  github:
    name: GitHub-Token
    runs-on: ubuntu-24.04
    steps:
      - name: GH_PUSH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret GH_PUSH_TOKEN is missing"; exit 1; }
          status=$(curl -sS -o repo.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$RELEASE_REPO")
          [ "$status" = 200 ] || { echo "::error::GitHub answers $status for $RELEASE_REPO: $(jq -r .message repo.json)"; exit 1; }
          jq '{full_name, permissions}' repo.json
          [ "$(jq -r .permissions.push repo.json)" = true ] || { echo "::error::the token may not write $RELEASE_REPO"; exit 1; }
          # Whether it may also change workflow files shows only in a push; sync-github.yml is the test of that.
          echo "The token may write $RELEASE_REPO."

  apple:
    name: Zertifikate und Apple-Zugänge
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
      MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: All set
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_INSTALLER_CERTIFICATE_P12 \
            MACOS_INSTALLER_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is missing"; missing=1; }
          done
          exit $missing
      # A keychain of its own that never enters the user's search list; the last step deletes it.
      - name: Certificates
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/secrets-check.keychain-db"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p check "$KEYCHAIN"
          security unlock-keychain -p check "$KEYCHAIN"
          failed=0
          import() {
            local label=$1 data=$2 password=$3 file="$RUNNER_TEMP/check.p12"
            if ! echo "$data" | base64 --decode > "$file" 2>/dev/null || [[ ! -s "$file" ]]; then
              echo "::error::$label is not base64 of a .p12"; failed=1; rm -f "$file"; return
            fi
            security import "$file" -P "$password" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null 2>&1 \
              || { echo "::error::$label does not open with its password"; failed=1; }
            rm -f "$file"
          }
          import MACOS_CERTIFICATE_P12 "$MACOS_CERTIFICATE_P12" "$MACOS_CERTIFICATE_PASSWORD"
          import MACOS_INSTALLER_CERTIFICATE_P12 "$MACOS_INSTALLER_CERTIFICATE_P12" "$MACOS_INSTALLER_CERTIFICATE_PASSWORD"
          security find-identity -v "$KEYCHAIN"
          for kind in "Developer ID Application" "Developer ID Installer"; do
            identity=$(security find-identity -v "$KEYCHAIN" | grep -o "\"$kind: [^\"]*\"" | head -1 | tr -d '"')
            if [[ -z "$identity" ]]; then echo "::error::no identity '$kind' (certificate with its private key)"; failed=1; continue; fi
            [[ "$identity" == *"($APPLE_TEAM_ID)" ]] || { echo "::error::$kind is not of the team in APPLE_TEAM_ID"; failed=1; }
            end=$(security find-certificate -c "$identity" -p "$KEYCHAIN" | openssl x509 -noout -enddate | cut -d= -f2)
            echo "$kind: valid until $end"
            security find-certificate -c "$identity" -p "$KEYCHAIN" | openssl x509 -noout -checkend 2592000 >/dev/null \
              || { echo "::warning::$kind expires within 30 days"; }
          done
          exit $failed
      - name: Apple ID (notarization)
        if: always()
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --output-format json > "$RUNNER_TEMP/history.json" 2> "$RUNNER_TEMP/history.err" \
            || { echo "::error::Apple refuses APPLE_ID, APPLE_TEAM_ID or APPLE_APP_PASSWORD"; tail -5 "$RUNNER_TEMP/history.err"; exit 1; }
          echo "Apple accepts the Apple ID; $(jq '.history | length' "$RUNNER_TEMP/history.json") notarizations in its history."
      - name: App Store Connect key (TestFlight)
        if: always()
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_KEY_P8 is not a .p8 key"; exit 1; }
          xcrun notarytool history --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --output-format json > /dev/null 2> "$RUNNER_TEMP/key.err" \
            || { echo "::error::Apple refuses ASC_KEY_P8, ASC_KEY_ID or ASC_ISSUER_ID"; tail -5 "$RUNNER_TEMP/key.err"; exit 1; }
          echo "Apple accepts the App Store Connect key."
      - name: Clear away
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/secrets-check.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/check.p12"
