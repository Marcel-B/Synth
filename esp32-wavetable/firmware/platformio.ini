; Alternative to idf.py: PlatformIO with its ESP-IDF framework (VS Code extension or `pip install platformio`).
; Not built in the cloud (the PlatformIO registry was blocked there); the ESP-IDF build was.
[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
monitor_speed = 115200
board_build.partitions = partitions.csv
