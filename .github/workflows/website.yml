# The website tonwerk.studio from website/ (plus the screenshots in docs/) on GitHub Pages. Pull requests only check
# that it builds; a push to main publishes it.
name: Website

on:
  push:
    branches: [main]
    paths: [website/**, docs/*.png, scripts/build-website.sh, CMakeLists.txt, .github/workflows/website.yml]
  pull_request:
    paths: [website/**, docs/*.png, scripts/build-website.sh, CMakeLists.txt, .github/workflows/website.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen und prüfen
        run: scripts/build-website.sh _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
