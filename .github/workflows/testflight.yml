# Builds Tonwerk for the iPad and for the Mac (the app with every plugin's AUv3; on the Mac sandboxed for the Mac App
# Store), signs it for the App Store and uploads it to TestFlight. Both carry the same bundle id, so App Store Connect
# keeps them in one app with an iOS and a macOS platform. Started by hand (Actions → TestFlight → Run workflow). Needs the repository secrets
#   APPLE_TEAM_ID   the team id of the developer account (already there for the Mac's signing)
#   ASC_KEY_ID      the App Store Connect API key's id (the ten characters in AuthKey_<id>.p8)
#   ASC_ISSUER_ID   the issuer id above the key list in App Store Connect
#   ASC_KEY_P8      the contents of AuthKey_<id>.p8
# The key needs the Admin role: with it Xcode registers the plugins' bundle ids, makes the distribution certificate and
# the profiles itself (cloud-managed signing), so nothing has to be set up by hand but the app's entry in App Store
# Connect (bundle id de.bvelop.tonwerk). Only the export signs with the team: signing the archive made each fresh
# runner create an Apple Development certificate of its own, until the account's limit refused the next. The
# cloud-managed distribution certificate the export uses takes no such slot.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (leer: die des letzten Tags)"
        required: false
        type: string
      platforms:
        description: "Plattformen"
        required: false
        type: choice
        options: [beide, iPad, Mac]
        default: beide

jobs:
  upload:
    name: ${{ matrix.platform }}-App zu TestFlight
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.platforms == '' || inputs.platforms == 'beide') && '["iPad","Mac"]' || format('["{0}"]', inputs.platforms)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # App Store Connect takes only apps built with the iOS 26 SDK or later (ITMS-90725); the runner's default Xcode
      # may be older, so the newest Xcode 26 or later it carries is chosen.
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(basename "$xcode" .app); version=${version#Xcode_}
          (( ${version%%.*} >= 26 )) || { echo "::error::no Xcode 26 on the runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Platform
        run: |
          if [[ "${{ matrix.platform }}" == iPad ]]; then
            echo "TONWERK_CMAKE_PLATFORM=-DCMAKE_SYSTEM_NAME=iOS" >> "$GITHUB_ENV"
            echo "TONWERK_DESTINATION=generic/platform=iOS" >> "$GITHUB_ENV"
            echo "TONWERK_PLUGINS=Tonwerk.app/PlugIns" >> "$GITHUB_ENV"
            # Unsigned; the bundles carry no entitlements on the iPad that the export would have to keep.
            echo "TONWERK_ARCHIVE_SIGNING=CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO" >> "$GITHUB_ENV"
          else
            echo "TONWERK_CMAKE_PLATFORM=-DTONWERK_MAC_STORE=ON" >> "$GITHUB_ENV"
            echo "TONWERK_DESTINATION=generic/platform=macOS" >> "$GITHUB_ENV"
            echo "TONWERK_PLUGINS=Tonwerk.app/Contents/PlugIns" >> "$GITHUB_ENV"
            # Ad hoc, which needs no certificate: the export re-signs every bundle with the entitlements it finds in
            # the archive's signatures, and an unsigned archive has none, so the store would get the app and its
            # AUv3s without the sandbox (refused).
            echo "TONWERK_ARCHIVE_SIGNING=CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER=" >> "$GITHUB_ENV"
          fi
      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!name}" ]] || { echo "::error::secret $name is missing"; missing=1; }
          done
          exit $missing
      - name: Version and build number
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.1.0)
          fi
          version="${version#v}"
          # TestFlight takes each upload only with a new build number; the run number grows with every run.
          echo "TONWERK_VERSION=$version" >> "$GITHUB_ENV"
          echo "TONWERK_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Tonwerk $version ($GITHUB_RUN_NUMBER)"
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: testflight-${{ matrix.platform }}
          max-size: 2G
      # Xcode ignores CMake's compiler launchers; its compiler settings point at ccache instead (as in build.yml).
      - name: ccache for Xcode
        run: |
          bin="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang)" > "$bin/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang++)" > "$bin/clang++"
          chmod +x "$bin/clang" "$bin/clang++"
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_BIN=$bin"
          } >> "$GITHUB_ENV"
      - name: Configure
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Static libraries stay out of the archive (SKIP_INSTALL), or Xcode makes a generic archive instead of an
          # app's; the app itself sets it back. The dSYMs go up with the build so TestFlight's crash reports name
          # functions. No LTO: with 34 binaries it would take hours.
          cmake -S . -B build-store -G Xcode $TONWERK_CMAKE_PLATFORM \
            -DTONWERK_VERSION="$TONWERK_VERSION" -DTONWERK_BUILD_NUMBER="$TONWERK_BUILD_NUMBER" -DTONWERK_LTO=OFF \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DCMAKE_XCODE_ATTRIBUTE_SKIP_INSTALL=YES \
            -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_CC="$CCACHE_BIN/clang" -DCMAKE_XCODE_ATTRIBUTE_CXX="$CCACHE_BIN/clang++" \
            -DCMAKE_XCODE_ATTRIBUTE_LD="$(xcrun -f clang)" -DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS="$(xcrun -f clang++)" \
            -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO
      - name: Archive
        run: |
          # No API key here: the archive signs nothing with the team (see the top), so it needs no profiles either.
          # $TONWERK_ARCHIVE_SIGNING is split into its settings on purpose.
          # shellcheck disable=SC2086
          xcodebuild -project build-store/TonwerkSynth.xcodeproj -scheme Tonwerk -configuration Release \
            -destination "$TONWERK_DESTINATION" -archivePath "$RUNNER_TEMP/Tonwerk.xcarchive" \
            $TONWERK_ARCHIVE_SIGNING archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -50; tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      # The export signs only what the archive holds: every AUv3 must be in it, and on the Mac each bundle must carry
      # the sandbox in its ad hoc signature for the export to keep it.
      - name: Check the archive
        run: |
          app="$RUNNER_TEMP/Tonwerk.xcarchive/Products/Applications/${TONWERK_PLUGINS%%/*}"
          plugins="$RUNNER_TEMP/Tonwerk.xcarchive/Products/Applications/$TONWERK_PLUGINS"
          ls "$plugins"
          count=$(find "$plugins" -maxdepth 1 -name '*.appex' | wc -l | tr -d ' ')
          echo "$count AUv3s"
          (( count == 34 )) || { echo "::error::expected 34 AUv3s in the archive, found $count"; exit 1; }
          [[ "${{ matrix.platform }}" == Mac ]] || exit 0
          for bundle in "$app" "$plugins"/*.appex; do
            codesign -d --entitlements - --xml "$bundle" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
            /usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$RUNNER_TEMP/entitlements.plist" 2>/dev/null \
              | grep -q true || { echo "::error::$(basename "$bundle") has no sandbox in the archive"; exit 1; }
          done
          echo "app and AUv3s sandboxed"
      - name: Upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>destination</key><string>upload</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key><false/>
              <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Tonwerk.xcarchive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
