# The ESP32 Eurorack module (esp32-wavetable/): the host tests against the plugins' voices, and the six firmware
# images (Tonwerk Wavetable, Tonwerk Physical, Tonwerk PD, Tonwerk Granular with its sources, Tonwerk Additiv, the
# bench test) built
# with ESP-IDF 5.3 and merged into one file for address 0x0 each, uploaded as the artifact `modul-firmware`. Images
# named (modul, physical, pd, granular, additiv, bench) by the input `uebernehmen` of a run started by hand, or by
# `[Images: physical ...]` in the newest commit message of a pull request's branch, are committed to that branch
# (firmware/modul/, firmware/modul-physical/, firmware/modul-pd/, firmware/modul-granular/, firmware/modul-additiv/,
# firmware/steckbrett-test/);
# images already tested on a module stay as they are unless named. A dispatch only works
# once this file is on main, hence the commit message for branches.
name: Modul

on:
  push:
    branches: [main]
    paths: [esp32-wavetable/firmware/**, wavetable/src/**, physical/src/**, pd/src/**, granular/src/**, additive/src/**, src/dsp/**, .github/workflows/modul.yml]
  pull_request:
    paths: [esp32-wavetable/firmware/**, wavetable/src/**, physical/src/**, pd/src/**, granular/src/**, additive/src/**, src/dsp/**, .github/workflows/modul.yml]
  workflow_dispatch:
    inputs:
      uebernehmen:
        description: Images, die ins Repo kommen (modul, physical, pd, granular, additiv, bench; durch Leerzeichen getrennt)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: modul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host-Tests (Wavetable, Physical, PD, Granular und Additiv gegen die Plugins)
        run: make -C esp32-wavetable/firmware/host test

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    permissions:
      contents: write
    steps:
      # The branch itself rather than the merge commit, so built images can be committed back to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Firmware bauen
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh" > /dev/null
          cd esp32-wavetable/firmware
          mkdir -p out
          build() {
            local name=$1 file=$2; shift 2
            idf.py -B "build-$name" -DIDF_TARGET=esp32s3 -DSDKCONFIG="build-$name/sdkconfig" "$@" build \
              2>&1 | tee "build-$name.log"
            # The module's own sources build without warnings.
            if grep -E "main/.*warning:" "build-$name.log"; then echo "Warnungen in $name"; exit 1; fi
            (cd "build-$name" && esptool.py --chip esp32s3 merge_bin -o "../out/$file" @flash_args)
            ls -l "build-$name"/*.bin "out/$file"
          }
          build modul tonwerk-modul.bin
          build physical tonwerk-physical.bin -DTONWERK_PHYSICAL=1
          build pd tonwerk-pd.bin -DTONWERK_PD=1
          build granular tonwerk-granular.bin -DTONWERK_GRANULAR=1
          build additiv tonwerk-additiv.bin -DTONWERK_ADDITIVE=1
          build bench tonwerk-steckbrett-test.bin -DTONWERK_BENCH=1
      - uses: actions/upload-artifact@v4
        with:
          name: modul-firmware
          path: esp32-wavetable/firmware/out/*.bin
      - name: Images ins Repo übernehmen
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          IMAGES: ${{ inputs.uebernehmen }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            IMAGES=$(git log -1 --format=%B | sed -n 's/.*\[Images: *\([a-z ]*\)\].*/\1/p' | head -1)
          fi
          if [ -z "$IMAGES" ]; then echo "Keine Images zu übernehmen"; exit 0; fi
          cd esp32-wavetable/firmware
          mkdir -p modul-physical modul-pd modul-granular modul-additiv
          for image in $IMAGES; do
            case "$image" in
              modul) cp out/tonwerk-modul.bin modul/ ;;
              physical) cp out/tonwerk-physical.bin modul-physical/ ;;
              pd) cp out/tonwerk-pd.bin modul-pd/ ;;
              granular) cp out/tonwerk-granular.bin modul-granular/ ;;
              additiv) cp out/tonwerk-additiv.bin modul-additiv/ ;;
              bench) cp out/tonwerk-steckbrett-test.bin steckbrett-test/ ;;
              *) echo "Unbekanntes Image: $image"; exit 1 ;;
            esac
          done
          git add modul modul-physical modul-pd modul-granular modul-additiv steckbrett-test
          if git diff --cached --quiet; then echo "Nichts zu übernehmen"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Modul: Firmware-Images aus CI übernehmen ($IMAGES)"
          git push origin "HEAD:$BRANCH"
