name: Build

# The tests on Linux and the Windows build are what is left on GitHub: everything for Apple runs in our own Gitea
# (.gitea/workflows/build.yml), which pushes main here when it changes (sync-github.yml), so this runs for main only.
# It builds without link-time optimisation and keeps the compiled objects between runs (ccache, sccache on Windows).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          max-size: 2G
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_LTO=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --target TonwerkSynthTests TonwerkAnalog_VST3 TonwerkFM_VST3 TonwerkSynth_VST3 ChromeGlitch_VST3 TonwerkDistortion_VST3 TonwerkWavetable_VST3 TonwerkDX_VST3 TonwerkGranular_VST3 TonwerkPhysical_VST3 TonwerkAdditiv_VST3 TonwerkGroovebox_VST3 TonwerkDrums_VST3 TonwerkRobovox_VST3 TonwerkWobble_VST3 TonwerkPD_VST3 TonwerkTape_VST3 TonwerkFreeze_VST3 TonwerkArp_VST3 TonwerkSampler_VST3 TonwerkBass_VST3 TonwerkVocoder_VST3 TonwerkDelay_VST3 TonwerkChorus_VST3 TonwerkGlue_VST3 TonwerkShimmer_VST3 TonwerkFilter_VST3 TonwerkNeuro_VST3 TonwerkStutter_VST3 TonwerkMultiband_VST3 TonwerkZone_VST3 TonwerkScope_VST3 TonwerkExpander_VST3 TonwerkLFO_VST3 TonwerkRumble_VST3 TonwerkReverb_VST3 TonwerkPump_VST3 TonwerkSpread_VST3 TonwerkRig_VST3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows gets no tests, only the build and the release package, so a change that breaks MSVC shows before a release.
  windows:
    name: VST3 (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Ninja in the compiler's environment instead of the Visual Studio generator, which ignores compiler launchers,
      # so sccache can keep the objects between runs.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          variant: sccache
          max-size: 2G
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_TESTS=OFF -DTONWERK_LTO=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build --parallel
      - name: Package
        run: scripts/package-release.sh windows ci build
