name: Build

# CI builds without link-time optimisation and keeps the compiled objects between runs (ccache, sccache on Windows),
# so a change rebuilds only what it touches. The release (release.yml) builds from scratch with LTO.

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          max-size: 2G
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_LTO=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --target TonwerkSynthTests TonwerkAnalog_VST3 TonwerkFM_VST3 TonwerkSynth_VST3 ChromeGlitch_VST3 TonwerkDistortion_VST3 TonwerkWavetable_VST3 TonwerkDX_VST3 TonwerkGranular_VST3 TonwerkPhysical_VST3 TonwerkAdditiv_VST3 TonwerkGroovebox_VST3 TonwerkRobovox_VST3 TonwerkWobble_VST3 TonwerkPD_VST3 TonwerkTape_VST3 TonwerkFreeze_VST3 TonwerkArp_VST3 TonwerkSampler_VST3 TonwerkBass_VST3 TonwerkVocoder_VST3 TonwerkDelay_VST3 TonwerkChorus_VST3 TonwerkGlue_VST3 TonwerkShimmer_VST3 TonwerkFilter_VST3 TonwerkNeuro_VST3 TonwerkStutter_VST3 TonwerkMultiband_VST3 TonwerkZone_VST3 TonwerkScope_VST3 TonwerkExpander_VST3 TonwerkLFO_VST3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows gets no tests, only the build and the release package, so a change that breaks MSVC shows before a release.
  windows:
    name: VST3 (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Ninja in the compiler's environment instead of the Visual Studio generator, which ignores compiler launchers,
      # so sccache can keep the objects between runs.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          variant: sccache
          max-size: 2G
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_TESTS=OFF -DTONWERK_LTO=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build --parallel
      - name: Package
        run: scripts/package-release.sh windows ci build

  # The iPad apps with their AUv3s, built for the simulator with Xcode (the iOS SDK comes only with it). A few apps are
  # started in an iPad simulator and photographed, so how the editors fit the screen shows without an iPad.
  ios:
    name: iPad (iOS-Simulator)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # App Store Connect takes only apps built with the iOS 26 SDK or later (ITMS-90725); the runner's default Xcode
      # may be older, so the newest Xcode 26 or later it carries is chosen.
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(basename "$xcode" .app); version=${version#Xcode_}
          (( ${version%%.*} >= 26 )) || { echo "::error::no Xcode 26 on the runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ios
          max-size: 2G
      # Xcode ignores CMake's compiler launchers; its compiler settings point at ccache instead.
      - name: ccache for Xcode
        run: |
          bin="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang)" > "$bin/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang++)" > "$bin/clang++"
          chmod +x "$bin/clang" "$bin/clang++"
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "TONWERK_IOS_CMAKE_ARGS=-DTONWERK_LTO=OFF -DCMAKE_XCODE_ATTRIBUTE_CC=$bin/clang -DCMAKE_XCODE_ATTRIBUTE_CXX=$bin/clang++ -DCMAKE_XCODE_ATTRIBUTE_LD=$(xcrun -f clang) -DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS=$(xcrun -f clang++) -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO"
          } >> "$GITHUB_ENV"
      - name: Build
        run: scripts/build-ios.sh simulator
      # The app must carry every plugin's AUv3, or Logic Pro for iPad and AUM never see it.
      - name: Check the AUv3s
        run: |
          app=build-ios/Tonwerk_artefacts/Release/Tonwerk.app
          [[ -d "$app" ]] || { echo "::error::Tonwerk.app was not built"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          count=0
          for appex in "$app"/PlugIns/*.appex; do
            [[ -d "$appex" ]] || continue
            ext=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$appex/Info.plist")
            # App Store Connect takes an extension's id only as the app's plus one part without a period.
            [[ "$ext" =~ ^"$id"\.[^.]+$ ]] || { echo "::error::$ext is not $id plus one part"; exit 1; }
            type=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:AudioComponents:0:type" "$appex/Info.plist")
            [[ -f "$appex/PrivacyInfo.xcprivacy" ]] || { echo "::error::$appex has no privacy manifest"; exit 1; }
            echo "$(basename "$appex"): $type"
            count=$((count + 1))
          done
          [[ -f "$app/PrivacyInfo.xcprivacy" ]] || { echo "::error::the app has no privacy manifest"; exit 1; }
          echo "$count AUv3s"
          (( count == 32 )) || { echo "::error::expected 32 AUv3s, found $count"; exit 1; }
      - name: Screenshots in the simulator
        run: |
          # The store takes iPad shots only at the 13" sizes (2752 x 2064 for the 13-inch iPad Pro), so an iPad Pro 13-inch
          # on the newest iOS runtime, made when the runner has none.
          runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
          udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$runtime" '.devices[$rt][]? | select(.name | test("iPad Pro 13")) | .udid' | tail -1)
          if [[ -z "$udid" ]]; then
            type=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("iPad Pro 13"))] | last | .identifier')
            udid=$(xcrun simctl create "iPad Pro 13" "$type" "$runtime")
          fi
          echo "simulator: $runtime $udid"
          xcrun simctl boot "$udid" || true   # already booted is fine
          xcrun simctl bootstatus "$udid" -b
          app=build-ios/Tonwerk_artefacts/Release/Tonwerk.app
          xcrun simctl install "$udid" "$app"
          xcrun simctl privacy "$udid" grant microphone de.bvelop.tonwerk || true
          mkdir -p ipad-screenshots
          # simctl hands SIMCTL_CHILD_* to the app; TONWERK_PLUGIN picks the plugin it opens.
          for name in "Tonwerk Wavetable" "Tonwerk Analog" "Tonwerk Groovebox" "Tonwerk DX" "Tonwerk Bass" "Tonwerk Scope"; do
            SIMCTL_CHILD_TONWERK_PLUGIN="$name" xcrun simctl launch "$udid" de.bvelop.tonwerk
            sleep 12
            xcrun simctl io "$udid" screenshot "ipad-screenshots/$name.png"
            xcrun simctl terminate "$udid" de.bvelop.tonwerk || true
          done
          # The simulator stays upright; the app is landscape only, so the pictures are turned to show it upright.
          for png in ipad-screenshots/*.png; do
            w=$(sips -g pixelWidth "$png" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$png" | awk '/pixelHeight/ {print $2}')
            if (( w < h )); then sips -r 270 "$png" >/dev/null; read -r w h <<<"$h $w"; fi
            [[ "${w}x$h" == 2752x2064 || "${w}x$h" == 2732x2048 ]] || echo "::warning::$png is ${w}x$h, not a 13-inch store size"
          done
          # iPadOS registers the AUv3s with the app; hosts find them there.
          xcrun simctl spawn "$udid" pluginkit -m -v -p com.apple.AudioUnit-UI || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screenshots
          path: ipad-screenshots
          retention-days: 30

  macstore:
    name: Mac App Store (Tonwerk mit AUv3)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The Mac App Store, too, takes only apps built with the newest SDKs.
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(basename "$xcode" .app); version=${version#Xcode_}
          (( ${version%%.*} >= 26 )) || { echo "::error::no Xcode 26 on the runner"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macstore
          max-size: 2G
      - name: ccache for Xcode
        run: |
          bin="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang)" > "$bin/clang"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$(xcrun -f clang++)" > "$bin/clang++"
          chmod +x "$bin/clang" "$bin/clang++"
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_BIN=$bin"
          } >> "$GITHUB_ENV"
      # Signed to run locally (ad hoc, with the entitlements), Apple Silicon only to keep CI short; the upload in
      # testflight.yml builds both architectures.
      - name: Build
        run: |
          cmake -S . -B build-mac -G Xcode -DTONWERK_MAC_STORE=ON -DTONWERK_LTO=OFF -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=- \
            -DCMAKE_XCODE_ATTRIBUTE_CC="$CCACHE_BIN/clang" -DCMAKE_XCODE_ATTRIBUTE_CXX="$CCACHE_BIN/clang++" \
            -DCMAKE_XCODE_ATTRIBUTE_LD="$(xcrun -f clang)" -DCMAKE_XCODE_ATTRIBUTE_LDPLUSPLUS="$(xcrun -f clang++)" \
            -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO
          cmake --build build-mac --config Release --target Tonwerk --parallel "$(sysctl -n hw.ncpu)"
      # The store rejects an app or extension without the sandbox, and an extension id that is not the app's plus one part.
      - name: Check the AUv3s
        run: |
          app=build-mac/Tonwerk_artefacts/Release/Tonwerk.app
          [[ -d "$app" ]] || { echo "::error::Tonwerk.app was not built"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist")
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$app/Contents/Info.plist"
          # The entitlements a bundle was signed with, as a plist file PlistBuddy can read.
          entitlements() { codesign -d --entitlements - --xml "$1" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null; }
          has() { /usr/libexec/PlistBuddy -c "Print :$2" "$RUNNER_TEMP/entitlements.plist" 2>/dev/null | grep -q true; }
          sandboxed() { entitlements "$1" && has "$1" com.apple.security.app-sandbox; }
          if ! sandboxed "$app"; then
            echo "::error::the app is not sandboxed"
            codesign -dvv "$app" 2>&1 | head -20
            cat "$RUNNER_TEMP/entitlements.plist"; echo
            find build-mac -name 'Tonwerk*.entitlements' -maxdepth 4 -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          fi
          has "$app" com.apple.security.device.audio-input || { echo "::error::the app lacks audio-input"; exit 1; }
          count=0
          for appex in "$app"/Contents/PlugIns/*.appex; do
            [[ -d "$appex" ]] || continue
            ext=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$appex/Contents/Info.plist")
            [[ "$ext" =~ ^"$id"\.[^.]+$ ]] || { echo "::error::$ext is not $id plus one part"; exit 1; }
            sandboxed "$appex" || { echo "::error::$appex is not sandboxed"; exit 1; }
            [[ -f "$appex/Contents/Resources/PrivacyInfo.xcprivacy" ]] || { echo "::error::$appex has no privacy manifest"; exit 1; }
            type=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:AudioComponents:0:type" "$appex/Contents/Info.plist")
            echo "$(basename "$appex"): $type $ext"
            count=$((count + 1))
          done
          echo "$count AUv3s"
          (( count == 32 )) || { echo "::error::expected 32 AUv3s, found $count"; exit 1; }
          # Registered with the system, a host finds them; shown for the log only.
          pluginkit -a "$app"/Contents/PlugIns/*.appex || true
          pluginkit -m -v -p com.apple.AudioUnit-UI | grep -i tonwerk || true
      # For the store page: the window's content is 1280 x 800, one of the store's 16:10 sizes, so the shot is the
      # window without its title bar (2560 x 1600 on a Retina display). Kept from failing the build: it depends on the
      # runner's display and its screen recording permission.
      - name: Screenshots for the Mac App Store
        continue-on-error: true
        run: |
          app=build-mac/Tonwerk_artefacts/Release/Tonwerk.app
          mkdir -p mac-screenshots
          system_profiler SPDisplaysDataType | grep -i -E "resolution|retina" || true
          # The largest window Tonwerk owns, as "x y width height" in points; every window goes to the log.
          cat > "$RUNNER_TEMP/bounds.swift" <<'EOF'
          import CoreGraphics
          import Foundation
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          var best: [String: CGFloat]? = nil
          for w in windows {
              let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
              guard let b = w[kCGWindowBounds as String] as? [String: CGFloat] else { continue }
              FileHandle.standardError.write("\(owner): \(b)\n".data(using: .utf8)!)
              if owner.hasPrefix("Tonwerk"), (b["Height"] ?? 0) > (best?["Height"] ?? 0) { best = b }
          }
          if let b = best { print("\(Int(b["X"]!)) \(Int(b["Y"]!)) \(Int(b["Width"]!)) \(Int(b["Height"]!))") }
          EOF
          swiftc -O "$RUNNER_TEMP/bounds.swift" -o "$RUNNER_TEMP/bounds"
          for name in "Tonwerk Wavetable" "Tonwerk Analog" "Tonwerk Groovebox" "Tonwerk DX" "Tonwerk Bass" "Tonwerk Granular"; do
            TONWERK_PLUGIN="$name" "$app/Contents/MacOS/Tonwerk" &
            pid=$!
            sleep 12
            bounds=$("$RUNNER_TEMP/bounds" || true)
            echo "$name: window $bounds"
            if [[ -z "$bounds" ]]; then
              screencapture -x "mac-screenshots/screen-$name.png" || true
            else
              read -r x y w h <<<"$bounds"
              # The content is the window's lowest 800 points (below the title bar).
              screencapture -x -R "$x,$((y + h - 800)),1280,800" "mac-screenshots/$name.png" || true
              sips -g pixelWidth -g pixelHeight "mac-screenshots/$name.png" | tail -2 || true
            fi
            kill "$pid"; wait "$pid" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: mac-screenshots
          if-no-files-found: ignore
          retention-days: 30

  macos:
    name: Audio Unit (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The default generator (Unix Makefiles) with the compiler of the Command Line Tools, as on a Mac without Xcode.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos
          max-size: 2G
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTONWERK_LTO=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sign ad hoc
        run: |
          for dir in "TonwerkAnalog:Tonwerk Analog" "TonwerkFM:Tonwerk FM" "TonwerkSynth:Tonwerk Synth" "ChromeGlitch:Chrome Glitch" "TonwerkDistortion:Tonwerk Distortion" \
            "TonwerkWavetable:Tonwerk Wavetable" "TonwerkDX:Tonwerk DX" "TonwerkGranular:Tonwerk Granular" "TonwerkPhysical:Tonwerk Physical" "TonwerkAdditiv:Tonwerk Additiv" "TonwerkGroovebox:Tonwerk Groovebox" "TonwerkRobovox:Tonwerk Robovox" "TonwerkWobble:Tonwerk Wobble" "TonwerkPD:Tonwerk PD" "TonwerkTape:Tonwerk Tape" "TonwerkFreeze:Tonwerk Freeze" "TonwerkArp:Tonwerk Arp" "TonwerkSampler:Tonwerk Sampler" "TonwerkBass:Tonwerk Bass" "TonwerkVocoder:Tonwerk Vocoder" "TonwerkDelay:Tonwerk Delay" "TonwerkChorus:Tonwerk Chorus" "TonwerkGlue:Tonwerk Glue" "TonwerkShimmer:Tonwerk Shimmer" "TonwerkFilter:Tonwerk Filter" "TonwerkNeuro:Tonwerk Neuro" "TonwerkStutter:Tonwerk Stutter" "TonwerkMultiband:Tonwerk Multiband" "TonwerkZone:Tonwerk Zone" "TonwerkScope:Tonwerk Scope" "TonwerkExpander:Tonwerk Expander" "TonwerkLFO:Tonwerk LFO"; do
            cd "$GITHUB_WORKSPACE/build/${dir%%:*}_artefacts/Release"
            name="${dir#*:}"
            "$GITHUB_WORKSPACE/scripts/sign-macos.sh" "AU/$name.component" "VST3/$name.vst3" "Standalone/$name.app"
          done
      # An effect's standalone app hears its audio interface only with a microphone usage text (and, under the hardened
      # runtime, the audio-input entitlement); without them macOS delivers silence and never asks.
      - name: Check the effects' input permission
        run: |
          for component in build/*_artefacts/Release/AU/*.component; do
            type=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:type" "$component/Contents/Info.plist")
            [[ "$type" == aufx || "$type" == aumf ]] || continue
            app="${component%/AU/*}/Standalone/$(basename "$component" .component).app"
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist" >/dev/null \
              || { echo "::error::$app has no NSMicrophoneUsageDescription"; exit 1; }
            # Ad hoc (here) the app has no hardened runtime and needs no entitlement; signed with the runtime it must.
            if codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime'; then
              codesign -d --entitlements - "$app" 2>/dev/null | grep -q audio-input \
                || { echo "::error::$app lacks the audio-input entitlement"; exit 1; }
            fi
            echo "$app: input permission ok"
          done
      - name: Validate with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/TonwerkAnalog_artefacts/Release/AU/Tonwerk Analog.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFM_artefacts/Release/AU/Tonwerk FM.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkSynth_artefacts/Release/AU/Tonwerk Synth.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/ChromeGlitch_artefacts/Release/AU/Chrome Glitch.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDistortion_artefacts/Release/AU/Tonwerk Distortion.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkWavetable_artefacts/Release/AU/Tonwerk Wavetable.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDX_artefacts/Release/AU/Tonwerk DX.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGranular_artefacts/Release/AU/Tonwerk Granular.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkPhysical_artefacts/Release/AU/Tonwerk Physical.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkAdditiv_artefacts/Release/AU/Tonwerk Additiv.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGroovebox_artefacts/Release/AU/Tonwerk Groovebox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkRobovox_artefacts/Release/AU/Tonwerk Robovox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkWobble_artefacts/Release/AU/Tonwerk Wobble.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkPD_artefacts/Release/AU/Tonwerk PD.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkTape_artefacts/Release/AU/Tonwerk Tape.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFreeze_artefacts/Release/AU/Tonwerk Freeze.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkArp_artefacts/Release/AU/Tonwerk Arp.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkSampler_artefacts/Release/AU/Tonwerk Sampler.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkBass_artefacts/Release/AU/Tonwerk Bass.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkVocoder_artefacts/Release/AU/Tonwerk Vocoder.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDelay_artefacts/Release/AU/Tonwerk Delay.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkChorus_artefacts/Release/AU/Tonwerk Chorus.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGlue_artefacts/Release/AU/Tonwerk Glue.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkShimmer_artefacts/Release/AU/Tonwerk Shimmer.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFilter_artefacts/Release/AU/Tonwerk Filter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkNeuro_artefacts/Release/AU/Tonwerk Neuro.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkStutter_artefacts/Release/AU/Tonwerk Stutter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkMultiband_artefacts/Release/AU/Tonwerk Multiband.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkZone_artefacts/Release/AU/Tonwerk Zone.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkScope_artefacts/Release/AU/Tonwerk Scope.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkExpander_artefacts/Release/AU/Tonwerk Expander.component" ~/Library/Audio/Plug-Ins/Components/
