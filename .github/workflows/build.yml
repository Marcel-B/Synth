name: Build

# CI builds without link-time optimisation and keeps the compiled objects between runs (ccache, sccache on Windows),
# so a change rebuilds only what it touches. The release (release.yml) builds from scratch with LTO.

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          max-size: 2G
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_LTO=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --target TonwerkSynthTests TonwerkAnalog_VST3 TonwerkFM_VST3 TonwerkSynth_VST3 ChromeGlitch_VST3 TonwerkDistortion_VST3 TonwerkWavetable_VST3 TonwerkDX_VST3 TonwerkGranular_VST3 TonwerkPhysical_VST3 TonwerkAdditiv_VST3 TonwerkGroovebox_VST3 TonwerkRobovox_VST3 TonwerkWobble_VST3 TonwerkPD_VST3 TonwerkTape_VST3 TonwerkFreeze_VST3 TonwerkArp_VST3 TonwerkSampler_VST3 TonwerkBass_VST3 TonwerkVocoder_VST3 TonwerkDelay_VST3 TonwerkChorus_VST3 TonwerkGlue_VST3 TonwerkShimmer_VST3 TonwerkFilter_VST3 TonwerkNeuro_VST3 TonwerkStutter_VST3 TonwerkMultiband_VST3 TonwerkZone_VST3 TonwerkScope_VST3 TonwerkExpander_VST3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows gets no tests, only the build and the release package, so a change that breaks MSVC shows before a release.
  windows:
    name: VST3 (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Ninja in the compiler's environment instead of the Visual Studio generator, which ignores compiler launchers,
      # so sccache can keep the objects between runs.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          variant: sccache
          max-size: 2G
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_TESTS=OFF -DTONWERK_LTO=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
      - name: Build
        shell: pwsh
        run: cmake --build build --parallel
      - name: Package
        run: scripts/package-release.sh windows ci build

  macos:
    name: Audio Unit (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The default generator (Unix Makefiles) with the compiler of the Command Line Tools, as on a Mac without Xcode.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos
          max-size: 2G
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTONWERK_LTO=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sign ad hoc
        run: |
          for dir in "TonwerkAnalog:Tonwerk Analog" "TonwerkFM:Tonwerk FM" "TonwerkSynth:Tonwerk Synth" "ChromeGlitch:Chrome Glitch" "TonwerkDistortion:Tonwerk Distortion" \
            "TonwerkWavetable:Tonwerk Wavetable" "TonwerkDX:Tonwerk DX" "TonwerkGranular:Tonwerk Granular" "TonwerkPhysical:Tonwerk Physical" "TonwerkAdditiv:Tonwerk Additiv" "TonwerkGroovebox:Tonwerk Groovebox" "TonwerkRobovox:Tonwerk Robovox" "TonwerkWobble:Tonwerk Wobble" "TonwerkPD:Tonwerk PD" "TonwerkTape:Tonwerk Tape" "TonwerkFreeze:Tonwerk Freeze" "TonwerkArp:Tonwerk Arp" "TonwerkSampler:Tonwerk Sampler" "TonwerkBass:Tonwerk Bass" "TonwerkVocoder:Tonwerk Vocoder" "TonwerkDelay:Tonwerk Delay" "TonwerkChorus:Tonwerk Chorus" "TonwerkGlue:Tonwerk Glue" "TonwerkShimmer:Tonwerk Shimmer" "TonwerkFilter:Tonwerk Filter" "TonwerkNeuro:Tonwerk Neuro" "TonwerkStutter:Tonwerk Stutter" "TonwerkMultiband:Tonwerk Multiband" "TonwerkZone:Tonwerk Zone" "TonwerkScope:Tonwerk Scope" "TonwerkExpander:Tonwerk Expander"; do
            cd "$GITHUB_WORKSPACE/build/${dir%%:*}_artefacts/Release"
            name="${dir#*:}"
            "$GITHUB_WORKSPACE/scripts/sign-macos.sh" "AU/$name.component" "VST3/$name.vst3" "Standalone/$name.app"
          done
      # An effect's standalone app hears its audio interface only with a microphone usage text and the audio-input
      # entitlement; without them macOS delivers silence and never asks.
      - name: Check the effects' input permission
        run: |
          for component in build/*_artefacts/Release/AU/*.component; do
            type=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:type" "$component/Contents/Info.plist")
            [[ "$type" == aufx || "$type" == aumf ]] || continue
            app="${component%/AU/*}/Standalone/$(basename "$component" .component).app"
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist" >/dev/null \
              || { echo "::error::$app has no NSMicrophoneUsageDescription"; exit 1; }
            codesign -d --entitlements - "$app" 2>/dev/null | grep -q audio-input \
              || { echo "::error::$app lacks the audio-input entitlement"; exit 1; }
            echo "$app: input permission ok"
          done
      - name: Validate with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/TonwerkAnalog_artefacts/Release/AU/Tonwerk Analog.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFM_artefacts/Release/AU/Tonwerk FM.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkSynth_artefacts/Release/AU/Tonwerk Synth.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/ChromeGlitch_artefacts/Release/AU/Chrome Glitch.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDistortion_artefacts/Release/AU/Tonwerk Distortion.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkWavetable_artefacts/Release/AU/Tonwerk Wavetable.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDX_artefacts/Release/AU/Tonwerk DX.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGranular_artefacts/Release/AU/Tonwerk Granular.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkPhysical_artefacts/Release/AU/Tonwerk Physical.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkAdditiv_artefacts/Release/AU/Tonwerk Additiv.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGroovebox_artefacts/Release/AU/Tonwerk Groovebox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkRobovox_artefacts/Release/AU/Tonwerk Robovox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkWobble_artefacts/Release/AU/Tonwerk Wobble.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkPD_artefacts/Release/AU/Tonwerk PD.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkTape_artefacts/Release/AU/Tonwerk Tape.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFreeze_artefacts/Release/AU/Tonwerk Freeze.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkArp_artefacts/Release/AU/Tonwerk Arp.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkSampler_artefacts/Release/AU/Tonwerk Sampler.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkBass_artefacts/Release/AU/Tonwerk Bass.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkVocoder_artefacts/Release/AU/Tonwerk Vocoder.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkDelay_artefacts/Release/AU/Tonwerk Delay.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkChorus_artefacts/Release/AU/Tonwerk Chorus.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkGlue_artefacts/Release/AU/Tonwerk Glue.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkShimmer_artefacts/Release/AU/Tonwerk Shimmer.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkFilter_artefacts/Release/AU/Tonwerk Filter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkNeuro_artefacts/Release/AU/Tonwerk Neuro.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkStutter_artefacts/Release/AU/Tonwerk Stutter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkMultiband_artefacts/Release/AU/Tonwerk Multiband.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkZone_artefacts/Release/AU/Tonwerk Zone.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkScope_artefacts/Release/AU/Tonwerk Scope.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "build/TonwerkExpander_artefacts/Release/AU/Tonwerk Expander.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i -e tonwerk -e glitch -e distortion -e wavetable -e dx -e granular -e physical -e additiv -e groovebox -e robovox -e wobble -e pd -e tape -e freeze -e arp -e sampler -e bass -e vocoder -e delay -e chorus -e glue -e shimmer -e filter -e neuro -e stutter -e multiband -e zone -e scope -e expander || true
          auval -strict -v aumu TwAn Bvlp
          auval -strict -v aumu TwFm Bvlp
          auval -strict -v aumu Twsy Bvlp
          auval -strict -v aufx ChGl Bvlp
          auval -strict -v aufx TwDs Bvlp
          auval -strict -v aumu TwWt Bvlp
          auval -strict -v aumu TwDx Bvlp
          auval -strict -v aumu TwGr Bvlp
          auval -strict -v aumu TwPh Bvlp
          auval -strict -v aumu TwAd Bvlp
          auval -strict -v aumu TwGb Bvlp
          auval -strict -v aumf TwRv Bvlp
          auval -strict -v aufx TwWb Bvlp
          auval -strict -v aumu TwPd Bvlp
          auval -strict -v aufx TwTp Bvlp
          auval -strict -v aufx TwFz Bvlp
          auval -strict -v aumi TwAr Bvlp
          auval -strict -v aumu TwSm Bvlp
          auval -strict -v aumu TwBs Bvlp
          auval -strict -v aumf TwVc Bvlp
          auval -strict -v aufx TwDl Bvlp
          auval -strict -v aufx TwCh Bvlp
          auval -strict -v aufx TwGl Bvlp
          auval -strict -v aufx TwSh Bvlp
          auval -strict -v aufx TwFl Bvlp
          auval -strict -v aumu TwNr Bvlp
          auval -strict -v aumu TwEx Bvlp
          auval -strict -v aufx TwSt Bvlp
          auval -strict -v aufx TwMb Bvlp
          auval -strict -v aufx TwZn Bvlp
          auval -strict -v aufx TwSc Bvlp
      - name: Package
        run: |
          cd "build/TonwerkSynth_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Synth.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Synth.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-VST3.zip"
          ditto -c -k --keepParent "Standalone/Tonwerk Synth.app" "$GITHUB_WORKSPACE/Tonwerk-Synth-App.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkAnalog_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Analog.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Analog-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Analog.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Analog-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkFM_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk FM.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-FM-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk FM.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-FM-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/ChromeGlitch_artefacts/Release"
          ditto -c -k --keepParent "AU/Chrome Glitch.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Chrome-Glitch-AU.zip"
          ditto -c -k --keepParent "VST3/Chrome Glitch.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Chrome-Glitch-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkDistortion_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Distortion.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Distortion-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Distortion.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Distortion-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkWavetable_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Wavetable.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Wavetable-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Wavetable.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Wavetable-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkDX_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk DX.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-DX-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk DX.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-DX-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkGranular_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Granular.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Granular-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Granular.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Granular-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkPhysical_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Physical.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Physical-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Physical.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Physical-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkAdditiv_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Additiv.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Additiv-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Additiv.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Additiv-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkGroovebox_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Groovebox.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Groovebox-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Groovebox.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Groovebox-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkRobovox_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Robovox.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Robovox-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Robovox.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Robovox-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkWobble_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Wobble.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Wobble-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Wobble.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Wobble-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkPD_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk PD.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-PD-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk PD.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-PD-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkTape_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Tape.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Tape-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Tape.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Tape-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkFreeze_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Freeze.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Freeze-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Freeze.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Freeze-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkArp_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Arp.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Arp-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Arp.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Arp-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkSampler_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Sampler.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Sampler-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Sampler.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Sampler-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkBass_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Bass.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Bass-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Bass.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Bass-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkVocoder_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Vocoder.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Vocoder-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Vocoder.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Vocoder-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkDelay_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Delay.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Delay-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Delay.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Delay-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkChorus_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Chorus.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Chorus-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Chorus.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Chorus-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkGlue_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Glue.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Glue-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Glue.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Glue-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkShimmer_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Shimmer.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Shimmer-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Shimmer.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Shimmer-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkFilter_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Filter.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Filter-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Filter.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Filter-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkNeuro_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Neuro.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Neuro-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Neuro.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Neuro-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkStutter_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Stutter.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Stutter-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Stutter.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Stutter-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkMultiband_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Multiband.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Multiband-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Multiband.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Multiband-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkZone_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Zone.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Zone-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Zone.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Zone-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkScope_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Scope.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Scope-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Scope.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Scope-VST3.zip"
          cd "$GITHUB_WORKSPACE/build/TonwerkExpander_artefacts/Release"
          ditto -c -k --keepParent "AU/Tonwerk Expander.component" "$GITHUB_WORKSPACE/Tonwerk-Synth-Expander-AU.zip"
          ditto -c -k --keepParent "VST3/Tonwerk Expander.vst3" "$GITHUB_WORKSPACE/Tonwerk-Synth-Expander-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tonwerk-synth-macos
          path: Tonwerk-Synth-*.zip
          retention-days: 30
