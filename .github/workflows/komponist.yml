name: Komponist

# Tonwerk Komponist (komponist/) is a CMake project of its own, so its build and tests run here, only when it changes.
on:
  push:
    paths:
      - "komponist/**"
      - ".github/workflows/komponist.yml"
  # Started by hand with a version, the run also publishes the Mac app as a GitHub release komponist-v<version>,
  # a pre-release that never becomes "latest", so the plugins' releases and the nightly plan (tags v*) stay as they are.
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a release (e.g. 0.1.0); empty builds only"
        required: false
        default: ""

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev \
            libcurl4-openssl-dev
      - name: Configure
        run: cmake -S komponist -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target TonwerkKomponistTests TonwerkKomponist
      # The fake server lets the tests go the whole way through HTTP and the stream.
      - name: Test
        run: |
          python3 komponist/tests/fake-api.py 8765 &
          sleep 1
          KOMPONIST_API_URL=http://127.0.0.1:8765/v1/messages ctest --test-dir build --output-on-failure

  macos:
    name: App (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          VERSION: ${{ inputs.version }}
        run: cmake -S komponist -B build -DCMAKE_BUILD_TYPE=Release ${VERSION:+-DKOMPONIST_VERSION=$VERSION}
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"
      - name: Test
        run: |
          python3 komponist/tests/fake-api.py 8765 &
          sleep 1
          KOMPONIST_API_URL=http://127.0.0.1:8765/v1/messages ctest --test-dir build --output-on-failure
      - name: Sign ad hoc and pack
        run: |
          cd "build/TonwerkKomponist_artefacts/Release"
          codesign --force --deep --sign - "Tonwerk Komponist.app"
          ditto -c -k --keepParent "Tonwerk Komponist.app" "$GITHUB_WORKSPACE/Tonwerk-Komponist.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Tonwerk-Komponist-macOS
          path: Tonwerk-Komponist.zip
          retention-days: 30

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tonwerk-Komponist-macOS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: |
            Tonwerk Komponist: Du beschreibst ein Stück in ein paar Worten, Claude schreibt es als MIDI-Datei mit einer Spur je Instrument, zum Ziehen in Logic Pro oder Ableton Live. Ein Prototyp für macOS 11 oder neuer (Apple Silicon und Intel); er braucht einen eigenen Anthropic-API-Schlüssel.

            Die App ist nur ad hoc signiert: nach dem Entpacken einmal Rechtsklick auf „Tonwerk Komponist“ → Öffnen, oder im Terminal `xattr -dr com.apple.quarantine "Tonwerk Komponist.app"`.
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be x.y.z, got $VERSION" >&2; exit 1; }
          mv Tonwerk-Komponist.zip "Tonwerk-Komponist-$VERSION-macOS.zip"
          gh release create "komponist-v$VERSION" "Tonwerk-Komponist-$VERSION-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Tonwerk Komponist $VERSION (Prototyp)" --notes "$NOTES"
