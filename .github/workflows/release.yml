name: Release

# A tag like v0.2.0 builds the plugins on macOS, Linux and Windows and attaches them to a GitHub release of that name.
# Started by hand with a version instead, it makes that tag itself on the commit it ran on (for when no tag can be pushed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    outputs:
      notarized: ${{ steps.handover.outputs.notarized }}
    # With these secrets the release is signed with Developer ID and notarized; without them it stays ad hoc, as before.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "Im Zertifikat steckt keine Identität 'Developer ID Application'." >&2
            exit 1
          fi
          echo "TONWERK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Version from the tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # The plugin's version comes from the tag, so Logic sees each release as a new one.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTONWERK_VERSION="$VERSION"
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          ARTEFACTS="build/TonwerkSynth_artefacts/Release"
          DIR="Tonwerk-Synth-$VERSION-macOS"
          mkdir "$DIR"
          cp -R "$ARTEFACTS/AU/Tonwerk Synth.component" "$ARTEFACTS/VST3/Tonwerk Synth.vst3" \
            "$ARTEFACTS/Standalone/Tonwerk Synth.app" "$DIR/"
          for synth in "TonwerkAnalog:Tonwerk Analog" "TonwerkFM:Tonwerk FM" "TonwerkDX:Tonwerk DX" "TonwerkGranular:Tonwerk Granular" "TonwerkPhysical:Tonwerk Physical" "TonwerkAdditiv:Tonwerk Additiv" "TonwerkGroovebox:Tonwerk Groovebox" "TonwerkRobovox:Tonwerk Robovox" "TonwerkWobble:Tonwerk Wobble" "TonwerkPD:Tonwerk PD" "TonwerkTape:Tonwerk Tape" "TonwerkFreeze:Tonwerk Freeze" "TonwerkArp:Tonwerk Arp" "TonwerkSampler:Tonwerk Sampler" "TonwerkBass:Tonwerk Bass" "TonwerkVocoder:Tonwerk Vocoder" "TonwerkDelay:Tonwerk Delay" "TonwerkChorus:Tonwerk Chorus" "TonwerkGlue:Tonwerk Glue" "TonwerkShimmer:Tonwerk Shimmer" "TonwerkFilter:Tonwerk Filter" "TonwerkNeuro:Tonwerk Neuro" "TonwerkStutter:Tonwerk Stutter" "TonwerkMultiband:Tonwerk Multiband" "TonwerkZone:Tonwerk Zone" "TonwerkScope:Tonwerk Scope"; do
            FROM="build/${synth%%:*}_artefacts/Release"
            PRODUCT="${synth#*:}"
            cp -R "$FROM/AU/$PRODUCT.component" "$FROM/VST3/$PRODUCT.vst3" "$FROM/Standalone/$PRODUCT.app" "$DIR/"
          done
          GLITCH="build/ChromeGlitch_artefacts/Release"
          cp -R "$GLITCH/AU/Chrome Glitch.component" "$GLITCH/VST3/Chrome Glitch.vst3" \
            "$GLITCH/Standalone/Chrome Glitch.app" "$DIR/"
          DISTORTION="build/TonwerkDistortion_artefacts/Release"
          cp -R "$DISTORTION/AU/Tonwerk Distortion.component" "$DISTORTION/VST3/Tonwerk Distortion.vst3" \
            "$DISTORTION/Standalone/Tonwerk Distortion.app" "$DIR/"
          WAVETABLE="build/TonwerkWavetable_artefacts/Release"
          cp -R "$WAVETABLE/AU/Tonwerk Wavetable.component" "$WAVETABLE/VST3/Tonwerk Wavetable.vst3" \
            "$WAVETABLE/Standalone/Tonwerk Wavetable.app" "$DIR/"
          # Ad hoc, or with Developer ID when the certificate step set TONWERK_SIGN_IDENTITY.
          scripts/sign-macos.sh "$DIR"/*.component "$DIR"/*.vst3 "$DIR"/*.app
          if [ -n "${TONWERK_SIGN_IDENTITY:-}" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            scripts/notarize-macos.sh "$DIR"/*.component "$DIR"/*.vst3 "$DIR"/*.app
            echo "NOTARIZED=1" >> "$GITHUB_ENV"
          fi
          cp scripts/install-release.sh "$DIR/install.sh"
          # The AGPL asks for the licence to travel with the binaries.
          cp LICENSE NOTICE "$DIR/"
          ditto -c -k --keepParent "$DIR" "$DIR.zip"
          echo "ZIP=$DIR.zip" >> "$GITHUB_ENV"
      - name: Validate with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Analog.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk FM.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Synth.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Chrome Glitch.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Distortion.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Wavetable.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk DX.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Granular.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Physical.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Additiv.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Groovebox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Robovox.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Wobble.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk PD.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Tape.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Freeze.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Arp.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Sampler.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Bass.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Vocoder.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Delay.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Chorus.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Glue.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Shimmer.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Filter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Neuro.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Stutter.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Multiband.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Zone.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "Tonwerk-Synth-$VERSION-macOS/Tonwerk Scope.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -strict -v aumu TwAn Bvlp
          auval -strict -v aumu TwFm Bvlp
          auval -strict -v aumu Twsy Bvlp
          auval -strict -v aufx ChGl Bvlp
          auval -strict -v aufx TwDs Bvlp
          auval -strict -v aumu TwWt Bvlp
          auval -strict -v aumu TwDx Bvlp
          auval -strict -v aumu TwGr Bvlp
          auval -strict -v aumu TwPh Bvlp
          auval -strict -v aumu TwAd Bvlp
          auval -strict -v aumu TwGb Bvlp
          auval -strict -v aumf TwRv Bvlp
          auval -strict -v aufx TwWb Bvlp
          auval -strict -v aumu TwPd Bvlp
          auval -strict -v aufx TwTp Bvlp
          auval -strict -v aufx TwFz Bvlp
          auval -strict -v aumi TwAr Bvlp
          auval -strict -v aumu TwSm Bvlp
          auval -strict -v aumu TwBs Bvlp
          auval -strict -v aumf TwVc Bvlp
          auval -strict -v aufx TwDl Bvlp
          auval -strict -v aufx TwCh Bvlp
          auval -strict -v aufx TwGl Bvlp
          auval -strict -v aufx TwSh Bvlp
          auval -strict -v aufx TwFl Bvlp
          auval -strict -v aumu TwNr Bvlp
          auval -strict -v aufx TwSt Bvlp
          auval -strict -v aufx TwMb Bvlp
          auval -strict -v aufx TwZn Bvlp
          auval -strict -v aufx TwSc Bvlp
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ env.ZIP }}
      - name: Hand over
        id: handover
        run: echo "notarized=${NOTARIZED:-}" >> "$GITHUB_OUTPUT"

  # Audio Units exist only on the Mac; Linux and Windows get the VST3 and the standalone apps. The tests run on Linux in
  # build.yml and on the Mac above, so these jobs only build.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONWERK_TESTS=OFF -DTONWERK_VERSION="$VERSION"
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Package
        run: scripts/package-release.sh linux "$VERSION" build
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: Tonwerk-Synth-*-Linux-x64.tar.gz

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # The C++ runtime linked in statically, so the apps and plugins run without the Visual C++ Redistributable.
      - name: Configure
        run: cmake -S . -B build -DTONWERK_TESTS=OFF -DTONWERK_VERSION="$VERSION" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        run: scripts/package-release.sh windows "$VERSION" build
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Tonwerk-Synth-*-Windows-x64.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          VERSION="${TAG#v}"
          if [ -n "${NOTARIZED:-}" ]; then
            SIGNING="Die Plugins sind mit Developer ID signiert und von Apple notarisiert; macOS öffnet sie nach dem Download ohne Rückfrage."
          else
            SIGNING="Die Plugins sind nur ad hoc signiert. Das Skript entfernt deshalb die Quarantäne-Markierung, die macOS nach dem Download setzt; ohne das lädt Logic sie nicht. Mehr im README."
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tonwerk Synth $VERSION" --notes "$(cat <<NOTES
          Synths: Tonwerk Analog, Tonwerk FM, Tonwerk DX, Tonwerk Wavetable, Tonwerk Granular, Tonwerk Physical, Tonwerk Additiv und Tonwerk PD, der Sampler Tonwerk Sampler, der Acid-Bass Tonwerk Bass, der Reese- und Neuro-Bass Tonwerk Neuro, die Drum-Machine Tonwerk Groovebox und das bisherige Tonwerk Synth für ältere Projekte. Effekte: Chrome Glitch, Tonwerk Distortion, Tonwerk Robovox, Tonwerk Vocoder, Tonwerk Wobble, Tonwerk Tape, Tonwerk Delay, Tonwerk Chorus, Tonwerk Glue, Tonwerk Shimmer, Tonwerk Filter, Tonwerk Stutter, Tonwerk Multiband, Tonwerk Zone, Tonwerk Scope und Tonwerk Freeze, dazu der MIDI-Effekt Tonwerk Arp (Arpeggiator und Step-Sequencer).

          **macOS** (\`Tonwerk-Synth-$VERSION-macOS.zip\`): Audio Unit (für Logic), VST3 und App für macOS 11 und neuer, Apple Silicon und Intel. Zip laden, im Terminal
          \`cd ~/Downloads/Tonwerk-Synth-*-macOS && zsh install.sh\`
          $SIGNING

          **Linux** (\`Tonwerk-Synth-$VERSION-Linux-x64.tar.gz\`): VST3 und Apps für x86-64. Entpacken und \`./install.sh\` aufrufen; die Plugins landen in \`~/.vst3\`, die Apps in \`~/.local/bin\`.

          **Windows** (\`Tonwerk-Synth-$VERSION-Windows-x64.zip\`): VST3 und Apps für 64-Bit-Windows. Die Ordner aus \`VST3\` nach \`C:\\Program Files\\Common Files\\VST3\` kopieren, die Apps liegen unter \`Apps\`. Sie sind nicht signiert, Windows SmartScreen fragt deshalb beim ersten Start nach („Weitere Informationen“ → „Trotzdem ausführen“).

          Linux und Windows sind gebaut, aber noch nicht in einem Host ausprobiert.
          NOTES
          )"
