name: Release

# The release itself is made in our own Gitea (.gitea/workflows/release.yml: macOS and Linux, tag, notes) and published
# here. That starts this run, which builds the Windows package and adds it to the release. Started by hand with a
# version, it does the same for a release that is there already.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    # The plugins' releases are tagged v*; Tonwerk Komponist's (komponist-v*) have no Windows package.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version from the tag
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$(scripts/plugin-version.sh "${TAG#v}")" >> "$GITHUB_ENV"
      # The C++ runtime linked in statically, so the apps and plugins run without the Visual C++ Redistributable.
      - name: Configure
        run: cmake -S . -B build -DTONWERK_TESTS=OFF -DTONWERK_VERSION="$PLUGIN_VERSION" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        run: scripts/package-release.sh windows "$VERSION" build
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Tonwerk-Synth-*-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
